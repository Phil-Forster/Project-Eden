<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'">
  <title>The Planet Crafter Achievement Tracker</title>
  <link rel="preload" as="image" href="assets/splash-eden.webp" type="image/webp">
  <link rel="preload" as="image" href="assets/project-eden-badge.webp" type="image/webp">
  <style>
    :root {
      color-scheme: dark;
      --splash-text: #e8f4f7;
      --splash-muted: #8da7ad;
      --splash-track: rgba(5,18,23,.86);
      --splash-border: rgba(77,215,243,.50);
      --splash-fill: #4dd7f3;
    }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; user-select:none; }
    body { display:grid; place-items:center; font-family:"Segoe UI",Arial,sans-serif; }
    .splash { position:relative; width:100%; height:100%; overflow:hidden; border-radius:22px; background:#061116; }
    .splash__art { display:block; width:100%; height:100%; object-fit:cover; -webkit-user-drag:none; pointer-events:none; }
    .splash__badge {
      position:absolute; left:38px; top:32px; width:126px; height:126px; object-fit:contain;
      transform:scale(1.06); transform-origin:center;
      filter:drop-shadow(0 8px 18px rgba(0,0,0,.48)); pointer-events:none; -webkit-user-drag:none;
    }
    .splash__brand {
      position:absolute; left:182px; top:62px; display:grid; gap:4px; color:var(--splash-text);
      text-shadow:0 2px 10px rgba(0,0,0,.92);
    }
    .splash__brand strong { font-size:34px; line-height:1; letter-spacing:.12em; }
    .splash__brand span { color:var(--splash-fill); font-size:11px; font-weight:800; letter-spacing:.22em; }
    .splash__runtime {
      position:absolute; left:50%; bottom:64px; width:min(390px,48%); transform:translateX(-50%);
      text-align:center; pointer-events:none;
    }
    .splash__progress { height:4px; overflow:hidden; border:1px solid var(--splash-border); border-radius:999px; background:var(--splash-track); }
    .splash__progress-fill { width:5%; height:100%; border-radius:inherit; background:var(--splash-fill); transition:width 220ms ease-out; }
    .splash__status {
      margin-top:11px; color:var(--splash-text); font-size:11px; font-weight:600; letter-spacing:.16em; line-height:1.4;
      text-transform:uppercase; text-shadow:0 1px 3px rgba(0,0,0,.85);
    }
    @media (prefers-reduced-motion: reduce) { .splash__progress-fill { transition:none; } }
  </style>
</head>
<body>
  <main class="splash" aria-label="The Planet Crafter Achievement Tracker loading">
    <img class="splash__art" src="assets/splash-eden.webp" alt="The Planet Crafter Achievement Tracker">
    <img class="splash__badge" src="assets/project-eden-badge.webp" alt="">
    <div class="splash__brand" aria-hidden="true">
      <strong>THE PLANET CRAFTER</strong>
      <span>PROJECT EDEN · ACHIEVEMENT TRACKER</span>
    </div>
    <section class="splash__runtime" aria-live="polite">
      <div id="splashProgress" class="splash__progress" role="progressbar" aria-label="Startup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="5">
        <div id="splashProgressFill" class="splash__progress-fill"></div>
      </div>
      <div id="splashStatus" class="splash__status">Starting achievement tracker…</div>
    </section>
  </main>
  <script src="splash.js"></script>
</body>
</html>
